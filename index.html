<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>We’re Still Marching</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

    <script src="https://unpkg.com/aframe-gif-shader/dist/aframe-gif-shader.min.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            position: fixed;
        }

        /* Camera feed fills screen - FIXED */
        video#arjs-video,
        video.arjs-video {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            background: #000 !important;
            z-index: 0 !important;
        }

        /* Canvas overlay - FIXED */
        a-scene {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 1 !important;
        }

        .a-canvas,
        canvas.a-canvas {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background: transparent !important;
        }

        /* Start overlay */
        #start {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .9);
            color: #fff;
            z-index: 3;
            text-align: center;
            padding: 24px;
        }

        #start button {
            margin-top: 12px;
            padding: 12px 18px;
            font-size: 16px;
            border-radius: 8px;
            border: 0;
            background: #ff6b6b;
            color: #fff;
            cursor: pointer;
        }

        #soundUnlock {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            background: rgba(0, 0, 0, .7);
            color: #fff;
            border: 1px solid #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>

<body>

    <div id="start">
        <h2>We’re Still Marching — AR Prototype</h2>
        <p>Tap Start, allow camera, then point at the printed <b>KANJI</b>, <b>HIRO</b>, <b>CIRCLE</b>, <b>TRIANGLE</b>, or
            <b>T</b> marker.</p>
        <button id="startBtn">Start</button>
    </div>

    <button id="soundUnlock">Tap to enable sound</button>

    <a-scene id="arScene" embedded vr-mode-ui="enabled:false" renderer="alpha:true; antialias:true"
        arjs="sourceType: webcam; debugUIEnabled:false" loading-screen="enabled:false">

        <a-assets timeout="1">
            <img id="introPosterImg" src="assets/intro-poster.png" crossorigin="anonymous">
            <audio id="introAudio" src="assets/intro_audio.mp3" preload="auto" playsinline webkit-playsinline></audio>

            <img id="thembekaGif" src="assets/thembeka_small.gif" crossorigin="anonymous">
            <audio id="thembekaAudio" src="assets/thembeka_audio.mp3" preload="auto" playsinline webkit-playsinline></audio>

            <img id="nalediGif" src="assets/naledi_final.gif" crossorigin="anonymous">
            <audio id="nalediAudio" src="assets/naledi_audio.mp3" preload="auto" playsinline webkit-playsinline></audio>

            <img id="leratoGif" src="assets/Lerato.gif" crossorigin="anonymous">
            <audio id="leratoAudio" src="assets/lerato_audio.mp3" preload="auto" playsinline webkit-playsinline></audio>

            <img id="exitPosterImg" src="assets/exit-poster.png" crossorigin="anonymous">
            <audio id="endingAudio" src="assets/ending_audio.mp3" preload="auto" playsinline webkit-playsinline></audio>
        </a-assets>

        <a-marker id="introMarker" preset="kanji" emitevents="true">
            <a-image id="introPoster" src="#introPosterImg" position="0 3.5 0" rotation="0 0 0" width="3.7" height="2"
                visible="false"></a-image>
            <a-entity light="type: ambient; intensity: 1"></a-entity>
            <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>
            <a-sound id="introSoundComponent" src="#introAudio" positional="false" volume="1" sound="loop: false;"></a-sound>
        </a-marker>

        <a-marker id="thembekaMarker" preset="hiro" emitevents="true">
            <a-plane id="thembekaPoster" position="0 2 0" rotation="0 0 0" width="3.2" height="4.2"
                material="shader: gif; src: #thembekaGif; transparent: true; alphaTest: 0.01" visible="false"></a-plane>
            <a-entity light="type: ambient; intensity: 1"></a-entity>
            <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>
            <a-sound id="thembekaSoundComponent" src="#thembekaAudio" positional="false" volume="1" sound="loop: false;"></a-sound>
        </a-marker>

        <a-marker id="nalediMarker" type="pattern" url="assets/pattern-i.patt" emitevents="true">
            <a-plane id="nalediPoster" position="0 2 0" rotation="0 0 0" width="3.2" height="4.2"
                material="shader: gif; src: #nalediGif; transparent: true; alphaTest: 0.01; depthWrite: false"
                visible="false"></a-plane>
            <a-entity light="type: ambient; intensity: 1"></a-entity>
            <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>
            <a-sound id="nalediSoundComponent" src="#nalediAudio" positional="false" volume="1" sound="loop: false;"></a-sound>
        </a-marker>

        <a-marker id="leratoMarker" type="pattern" url="assets/pattern-triangle.patt" emitevents="true">
            <a-plane id="leratoPoster" position="0 2 0" rotation="0 0 0" width="3.2" height="4.2"
                material="shader: gif; src: #leratoGif; transparent: true; alphaTest: 0.01" visible="false"></a-plane>
            <a-entity light="type: ambient; intensity: 1"></a-entity>
            <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>
            <a-sound id="leratoSoundComponent" src="#leratoAudio" positional="false" volume="1" sound="loop: false;"></a-sound>
        </a-marker>

        <a-marker id="exitMarker" type="pattern" url="assets/pattern-T_marker.patt" emitevents="true">
            <a-image id="exitPoster" src="#exitPosterImg" position="0 4 0" rotation="0 0 0" width="4" height="2"
                visible="false"></a-image>
            <a-entity light="type: ambient; intensity: 1"></a-entity>
            <a-entity light="type: directional; intensity: 0.8" position="1 3 2"></a-entity>
            <a-sound id="endingSoundComponent" src="#endingAudio" positional="false" volume="1" sound="loop: false;"></a-sound>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

   <script>
    const arScene = document.getElementById('arScene');
    const startUI = document.getElementById('start');
    const startBtn = document.getElementById('startBtn');
    const unlockBtn = document.getElementById('soundUnlock');

    let markersData = [];
    let allSoundComps = [];
    let userPrimed = false;

    // --- Core Data Definitions ---
    const MARKER_CONFIG = [
        { marker: 'introMarker', poster: 'introPoster', audioAsset: 'introAudio', soundComponent: 'introSoundComponent' },
        { marker: 'thembekaMarker', poster: 'thembekaPoster', audioAsset: 'thembekaAudio', soundComponent: 'thembekaSoundComponent' },
        { marker: 'nalediMarker', poster: 'nalediPoster', audioAsset: 'nalediAudio', soundComponent: 'nalediSoundComponent' },
        { marker: 'leratoMarker', poster: 'leratoPoster', audioAsset: 'leratoAudio', soundComponent: 'leratoSoundComponent' },
        { marker: 'exitMarker', poster: 'exitPoster', audioAsset: 'endingAudio', soundComponent: 'endingSoundComponent' },
    ];

    // --- 🌟 CRITICAL FIX: Unlock Web Audio Context on user gesture 🌟 ---
    function unlockAudioContext() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
            const context = new AudioContext();
            if (context.state === 'suspended') {
                context.resume().then(() => {
                    console.log('Web Audio Context resumed successfully.');
                }).catch(e => console.error('Error resuming audio context:', e));
            }
        }
    }

    // --- A-Frame Initialization Logic ---
    arScene.addEventListener('loaded', () => {
        // Retrieve the A-Frame sound components ONLY after the scene is loaded.
        markersData = MARKER_CONFIG.map(data => ({
            markerEl: document.getElementById(data.marker),
            posterEl: document.getElementById(data.poster),
            audioEl: document.getElementById(data.audioAsset), // Raw HTML Audio for priming
            soundComp: document.getElementById(data.soundComponent)?.components?.sound
        })).filter(data => data.soundComp);

        allSoundComps = markersData.map(m => m.soundComp);

        // Set up marker event listeners after components are mapped
        markersData.forEach(setupMarker);
    });

    // --- Utility Functions ---

    /* Canvas Sync (Kept for reliable sizing on iOS/mobile) */
    function syncCanvasToVideo() {
        const v = document.querySelector('video#arjs-video, video.arjs-video');
        const c = document.querySelector('canvas.a-canvas');
        if (!v || !c) return;
        const r = v.getBoundingClientRect();
        c.style.top = r.top + 'px';
        c.style.left = r.left + 'px';
        c.style.width = r.width + 'px';
        c.style.height = r.height + 'px';
    }
    const bootSync = setInterval(syncCanvasToVideo, 100);
    setTimeout(() => clearInterval(bootSync), 4000);
    window.addEventListener('resize', syncCanvasToVideo);
    window.addEventListener('orientationchange', () => setTimeout(syncCanvasToVideo, 300));

    /* Helpers */
    function hideAllPosters() {
        markersData.forEach(m => m.posterEl.setAttribute('visible', 'false'));
    }

    /* Use A-Frame sound methods (.playSound(), .stopSound()) */
    function playOnly(targetSoundComp) {
        // Stop all sounds first
        allSoundComps.forEach(s => {
            if (s.isPlaying) {
                s.stopSound();
            }
        });
        // Try to play the new sound using A-Frame
        try {
            if (userPrimed) {
                targetSoundComp.playSound();
                unlockBtn.style.display = 'none';
            } else {
                unlockBtn.style.display = 'block';
            }
        } catch (e) {
            console.error("Error playing A-Frame sound component:", e);
            unlockBtn.style.display = 'block';
        }
    }

    /* --- Event Handlers --- */

    /* Start Button - CRITICAL for iOS Media Unlock */
    startBtn.addEventListener('click', async () => {
        // 1. Force Web Audio Context Unlock
        unlockAudioContext();
        
        // 2. Prime raw HTML5 audio elements for general media permission
        markersData.forEach(m => {
            try { m.audioEl.play(); m.audioEl.pause(); m.audioEl.currentTime = 0; } catch (_) { }
        });

        userPrimed = true;
        startUI.style.display = 'none';
        setTimeout(syncCanvasToVideo, 200);
    });

    /* Event listeners for all markers */
    function setupMarker(data) {
        data.markerEl.addEventListener('markerFound', () => {
            hideAllPosters();
            data.posterEl.setAttribute('visible', 'true');
            playOnly(data.soundComp); // Play the A-Frame sound component
        });

        data.markerEl.addEventListener('markerLost', () => {
            data.posterEl.setAttribute('visible', 'false');
            if (data.soundComp.isPlaying) {
                data.soundComp.stopSound(); // Stop the A-Frame sound component
            }
        });
    }

    /* iOS unlock (Tap to enable sound) */
    unlockBtn.addEventListener('click', () => {
        // 1. Re-attempt Web Audio Context Unlock
        unlockAudioContext();

        // 2. Find and play a stopped sound component
        const stoppedSound = allSoundComps.find(s => s.pool.length > 0 && !s.isPlaying);
        if (stoppedSound) {
            stoppedSound.playSound();
            unlockBtn.style.display = 'none';
        }
    });
</script>
</body>

</html>
