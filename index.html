<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>We’re Still Marching - AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

    <script src="https://unpkg.com/aframe-gif-shader/dist/aframe-gif-shader.min.js"></script>

    <style>
        /* General setup to ensure fullscreen */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        /* AR.js and A-Frame components for fullscreen - Crucial for sizing fix */
        a-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Start overlay */
        #start {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .9);
            color: #fff;
            z-index: 3;
            text-align: center;
            padding: 24px;
        }

        #start button {
            margin-top: 12px;
            padding: 12px 18px;
            font-size: 16px;
            border-radius: 8px;
            border: 0;
            background: #ff6b6b;
            color: #fff;
            cursor: pointer;
        }

        #soundUnlock {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            background: rgba(0, 0, 0, .7);
            color: #fff;
            border: 1px solid #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        /* Explicitly setting video to cover viewport if AR.js doesn't default correctly */
        video#arjs-video,
        video.arjs-video {
            object-fit: cover !important;
        }
    </style>
</head>

<body>

    <div id="start">
        <h2>We’re Still Marching — AR Prototype</h2>
        <p>Tap Start, allow camera, then point at the printed **KANJI**, **HIRO**, **CIRCLE**, **TRIANGLE**, or
            **T** marker.</p>
        <button id="startBtn">Start</button>
    </div>

    <button id="soundUnlock">Tap to enable sound</button>

    <a-scene embedded vr-mode-ui="enabled:false" renderer="alpha:true; antialias:true"
        arjs="sourceType: webcam; debugUIEnabled:false; sourceWidth:1280; sourceHeight:960;" loading-screen="enabled:false">

        <a-assets timeout="1">
            <img id="introPosterImg" src="assets/intro-poster.png" crossorigin="anonymous">
            <audio id="introAudio" src="assets/intro_audio.mp3" preload="auto" playsinline webkit-playsinline></audio>

            <img id="thembekaGif" src="assets/thembeka_small.gif" crossorigin="anonymous">
            <audio id="thembekaAudio" src="assets/thembeka_audio.mp3" preload="auto" playsinline webkit-playsinline></audio>

            <img id="nalediGif" src="assets/naledi_final.gif" crossorigin="anonymous">
            <audio id="nalediAudio" src="assets/naledi_audio.mp3" preload="auto" playsinline webkit-playsinline></audio>

            <img id="leratoGif" src="assets/Lerato.gif" crossorigin="anonymous">
            <audio id="leratoAudio" src="assets/lerato_audio.mp3" preload="auto" playsinline webkit-playsinline></audio>

            <img id="exitPosterImg" src="assets/exit-poster.png" crossorigin="anonymous">
            <audio id="endingAudio" src="assets/ending_audio.mp3" preload="auto" playsinline webkit-playsinline></audio>
        </a-assets>

        <a-marker id="introMarker" preset="kanji" emitevents="true">
            <a-image id="introPoster" src="#introPosterImg" position="0 2 0" rotation="0 0 0" width="4" height="1.33"
                visible="false"></a-image>
            <a-entity light="type: ambient; intensity: 1"></a-entity>
            <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>
        </a-marker>

        <a-marker id="thembekaMarker" preset="hiro" emitevents="true">
            <a-plane id="thembekaPoster" position="0 2 0" rotation="0 0 0" width="3.2" height="4.2"
                material="shader: gif; src: #thembekaGif; transparent: true; alphaTest: 0.01" visible="false"></a-plane>
            <a-entity light="type: ambient; intensity: 1"></a-entity>
            <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>
        </a-marker>

        <a-marker id="nalediMarker" type="pattern" url="assets/pattern-circle.patt" emitevents="true">
            <a-plane id="nalediPoster" position="0 2 0" rotation="0 0 0" width="3.2" height="4.2"
                material="shader: gif; src: #nalediGif; transparent: true; alphaTest: 0.6; depthWrite: false"
                visible="false"></a-plane>

            <a-entity light="type: ambient; intensity: 1"></a-entity>
            <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>
        </a-marker>

        <a-marker id="leratoMarker" type="pattern" url="assets/pattern-triangle.patt" emitevents="true">
            <a-plane id="leratoPoster" position="0 2 0" rotation="0 0 0" width="3.2" height="4.2"
                material="shader: gif; src: #leratoGif; transparent: true; alphaTest: 0.01" visible="false"></a-plane>
            <a-entity light="type: ambient; intensity: 1"></a-entity>
            <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>
        </a-marker>

        <a-marker id="exitMarker" type="pattern" url="assets/pattern-T_marker.patt" emitevents="true">
            <a-image id="exitPoster" src="#exitPosterImg" position="0 2.5 0" rotation="0 0 0" width="5" height="1"
                visible="false"></a-image>
            <a-entity light="type: ambient; intensity: 1"></a-entity>
            <a-entity light="type: directional; intensity: 0.8" position="1 3 2"></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const startUI = document.getElementById('start');
        const startBtn = document.getElementById('startBtn');
        const unlockBtn = document.getElementById('soundUnlock');

        // Simplified asset structure for cleaner code
        const markers = [
            { id: 'introMarker', poster: 'introPoster', audio: 'introAudio' },
            { id: 'thembekaMarker', poster: 'thembekaPoster', audio: 'thembekaAudio' },
            { id: 'nalediMarker', poster: 'nalediPoster', audio: 'nalediAudio' },
            { id: 'leratoMarker', poster: 'leratoPoster', audio: 'leratoAudio' },
            { id: 'exitMarker', poster: 'exitPoster', audio: 'endingAudio' },
        ].map(m => ({
            marker: document.getElementById(m.id),
            poster: document.getElementById(m.poster),
            audio: document.getElementById(m.audio),
        }));

        let userPrimed = false;

        /* Removed syncCanvasToVideo as AR.js should handle fullscreen correctly with the new A-Frame settings */

        /* Helpers */
        function hideAllPosters() {
            markers.forEach(m => m.poster.setAttribute('visible', 'false'));
        }

        function playOnly(audioEl) {
            markers.forEach(m => {
                try { m.audio.pause(); m.audio.currentTime = 0; } catch (_) { }
            });
            // Show sound unlock button if play fails (e.g., on iOS/mobile)
            if (userPrimed) audioEl.play().catch(() => unlockBtn.style.display = 'block');
            else unlockBtn.style.display = 'block';
        }

        /* Start */
        startBtn.addEventListener('click', () => {
            userPrimed = true; // unlock audio permission
            startUI.style.display = 'none';
        });

        /* Event listeners for all markers */
        function setupMarker(marker, poster, audio) {
            marker.addEventListener('markerFound', () => {
                hideAllPosters();
                poster.setAttribute('visible', 'true');
                playOnly(audio);
            });
            marker.addEventListener('markerLost', () => {
                poster.setAttribute('visible', 'false');
                try { audio.pause(); audio.currentTime = 0; } catch (_) { }
            });
        }

        markers.forEach(m => setupMarker(m.marker, m.poster, m.audio));

        /* iOS unlock */
        unlockBtn.addEventListener('click', () => {
            markers
                .map(m => m.audio)
                .find(a => a.paused)
                ?.play()
                .then(() => unlockBtn.style.display = 'none')
                .catch(() => { });
        });
    </script>
</body>

</html>
