<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>We’re Still Marching — AR Experience</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

    <script src="https://unpkg.com/aframe-gif-shader/dist/aframe-gif-shader.min.js"></script>

    <style>
        /* --- General Layout & Fullscreen Fixes (From the previous suggested fix) --- */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            /* Changed position: fixed to position: absolute for better mobile compatibility */
            position: absolute; 
        }

        /* Essential for AR.js fullscreen performance */
        video#arjs-video,
        video.arjs-video {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important; /* Ensures video covers screen without stretching */
            background: #000 !important;
            z-index: 0 !important;
        }

        a-scene {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 1 !important;
        }

        /* UI elements */
        #start {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .9);
            color: #fff;
            z-index: 3;
            text-align: center;
            padding: 24px;
        }

        #start button {
            margin-top: 12px;
            padding: 12px 18px;
            font-size: 16px;
            border-radius: 8px;
            border: 0;
            background: #ff6b6b;
            color: #fff;
            cursor: pointer;
        }

        #soundUnlock {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            background: rgba(0, 0, 0, .7);
            color: #fff;
            border: 1px solid #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>

<body>

    <div id="start">
        <h2>We’re Still Marching — AR Prototype</h2>
        <p>Tap **Start**, allow camera, then point at the printed **KANJI**, **HIRO**, **CIRCLE**, **TRIANGLE**, or
            **T** marker.</p>
        <button id="startBtn">Start</button>
    </div>

    <button id="soundUnlock">Tap to enable sound</button>

    <a-scene embedded vr-mode-ui="enabled:false" renderer="alpha:true; antialias:true"
        arjs="sourceType: webcam; debugUIEnabled:false; sourceWidth:1280; sourceHeight:960;" loading-screen="enabled:false">

        <a-assets timeout="3000">
            <img id="introPosterImg" src="assets/intro-poster.png" crossorigin="anonymous">
            <audio id="introAudio" src="assets/intro_audio.mp3" preload="auto" playsinline webkit-playsinline></audio>

            <img id="thembekaGif" src="assets/thembeka_small.gif" crossorigin="anonymous">
            <audio id="thembekaAudio" src="assets/thembeka_audio.mp3" preload="auto" playsinline webkit-playsinline></audio>

            <img id="nalediGif" src="assets/naledi_final.gif" crossorigin="anonymous">
            <audio id="nalediAudio" src="assets/naledi_audio.mp3" preload="auto" playsinline webkit-playsinline></audio>

            <img id="leratoGif" src="assets/Lerato.gif" crossorigin="anonymous">
            <audio id="leratoAudio" src="assets/lerato_audio.mp3" preload="auto" playsinline webkit-playsinline></audio>

            <img id="exitPosterImg" src="assets/exit-poster.png" crossorigin="anonymous">
            <audio id="endingAudio" src="assets/ending_audio.mp3" preload="auto" playsinline webkit-playsinline></audio>
        </a-assets>

        <a-marker id="introMarker" preset="kanji" emitevents="true" sound="src: #introAudio; autoplay: false; volume: 1;"></a-marker>
        <a-entity id="introPosterContainer">
            <a-image id="introPoster" src="#introPosterImg" position="0 3.5 0" rotation="0 0 0" width="12" height="4"
                visible="false"></a-image>
            <a-entity light="type: ambient; intensity: 1"></a-entity>
        </a-entity>
        

        <a-marker id="thembekaMarker" preset="hiro" emitevents="true" sound="src: #thembekaAudio; autoplay: false; volume: 1;"></a-marker>
        <a-entity id="thembekaPosterContainer">
            <a-plane id="thembekaPoster" position="0 2 0" rotation="0 0 0" width="6.2" height="7.2"
                material="shader: gif; src: #thembekaGif; transparent: true; alphaTest: 0.01" visible="false"></a-plane>
            <a-entity light="type: ambient; intensity: 1"></a-entity>
        </a-entity>

        <a-marker id="nalediMarker" type="pattern" url="assets/pattern-circle.patt" emitevents="true" sound="src: #nalediAudio; autoplay: false; volume: 1;"></a-marker>
        <a-entity id="nalediPosterContainer">
            <a-plane id="nalediPoster" position="0 2 0" rotation="0 0 0" width="6.2" height="7.2"
                material="shader: gif; src: #nalediGif; transparent: true; alphaTest: 0.6; depthWrite: false"
                visible="false"></a-plane>
            <a-entity light="type: ambient; intensity: 1"></a-entity>
        </a-entity>

        <a-marker id="leratoMarker" type="pattern" url="assets/pattern-triangle.patt" emitevents="true" sound="src: #leratoAudio; autoplay: false; volume: 1;"></a-marker>
        <a-entity id="leratoPosterContainer">
            <a-plane id="leratoPoster" position="0 2 0" rotation="0 0 0" width="6.2" height="7.2"
                material="shader: gif; src: #leratoGif; transparent: true; alphaTest: 0.01" visible="false"></a-plane>
            <a-entity light="type: ambient; intensity: 1"></a-entity>
        </a-entity>

        <a-marker id="exitMarker" type="pattern" url="assets/pattern-T_marker.patt" emitevents="true" sound="src: #endingAudio; autoplay: false; volume: 1;"></a-marker>
        <a-entity id="exitPosterContainer">
            <a-image id="exitPoster" src="#exitPosterImg" position="0 4 0" rotation="0 0 0" width="12" height="4"
                visible="false"></a-image>
            <a-entity light="type: ambient; intensity: 1"></a-entity>
        </a-entity>
        
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const startUI = document.getElementById('start');
        const startBtn = document.getElementById('startBtn');
        const unlockBtn = document.getElementById('soundUnlock');

        // Combined asset structure for clean management
        const assets = [
            { id: 'intro', markerEl: document.getElementById('introMarker'), posterEl: document.getElementById('introPoster') },
            { id: 'thembeka', markerEl: document.getElementById('thembekaMarker'), posterEl: document.getElementById('thembekaPoster') },
            { id: 'naledi', markerEl: document.getElementById('nalediMarker'), posterEl: document.getElementById('nalediPoster') },
            { id: 'lerato', markerEl: document.getElementById('leratoMarker'), posterEl: document.getElementById('leratoPoster') },
            { id: 'exit', markerEl: document.getElementById('exitMarker'), posterEl: document.getElementById('exitPoster') },
        ];

        let userPrimed = false;
        let currentSoundComponent = null;

        /* START/Audio Unlock Logic (Simplified) */
        startBtn.addEventListener('click', () => {
            userPrimed = true; 
            startUI.style.display = 'none';
        });

        /* --- Core Marker/Audio/Visibility Logic (Inspired by your friend's code) --- */

        // Helper to stop all playing sounds
        function stopAllSounds() {
            assets.forEach(asset => {
                const soundComp = asset.markerEl.components.sound;
                if (soundComp && soundComp.isPlaying) {
                    soundComp.stopSound();
                }
            });
            currentSoundComponent = null;
        }
        
        // Helper to hide all posters
        function hideAllPosters() {
            assets.forEach(asset => {
                asset.posterEl.setAttribute('visible', 'false');
            });
        }
        

        // Set up event listeners for each marker
        assets.forEach(asset => {
            const marker = asset.markerEl;
            const poster = asset.posterEl;
            
            // Marker Found: Show GIF, Stop previous audio, Start new audio
            marker.addEventListener('markerFound', () => {
                hideAllPosters();
                poster.setAttribute('visible', 'true');
                
                const soundComp = marker.components.sound;
                
                if (soundComp && soundComp !== currentSoundComponent) {
                    stopAllSounds(); // Stop all existing sounds
                    
                    if (userPrimed) {
                        // Attempt to play sound, show unlock button if blocked (mobile browser policy)
                        soundComp.playSound();
                        currentSoundComponent = soundComp;
                        unlockBtn.style.display = 'none';
                    } else {
                        // User needs to tap to prime the audio
                        unlockBtn.style.display = 'block';
                    }
                }
            });

            // Marker Lost: Hide GIF, Audio continues until a new marker is found
            marker.addEventListener('markerLost', () => {
                poster.setAttribute('visible', 'false');
                // IMPORTANT: Audio is NOT stopped here, matching your friend's logic.
                // It continues until another marker is found and triggers stopAllSounds().
            });
        });

        /* iOS unlock functionality */
        unlockBtn.addEventListener('click', () => {
            if (currentSoundComponent) {
                currentSoundComponent.playSound();
                unlockBtn.style.display = 'none';
            } else {
                // If the user taps unlock but no marker is currently visible, we can't play anything.
                // We could prime one of the sounds, but for simplicity, we'll just wait for a marker.
                // You might want to remove the unlock button entirely if no sound is active.
                unlockBtn.style.display = 'none';
            }
        });
    </script>
</body>

</html>
