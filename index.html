<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>We’re Still Marching</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"/>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <!-- AR.js for A-Frame -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  <!-- Chroma-key material (key out pure blue) -->
  <script src="https://unpkg.com/aframe-chromakey-material@1.0.6/dist/aframe-chromakey-material.min.js"></script>

  <style>
    html, body {
      margin:0; padding:0; width:100%; height:100%;
      overflow:hidden; background:#000; font-family:Arial,sans-serif;
    }

    /* Show ONLY the AR.js camera video behind the canvas */
    video#arjs-video, video.arjs-video{
      position:fixed; inset:0;
      width:100%; height:100%; object-fit:cover;
      z-index:0; background:#000;
    }

    /* Scene & canvas layered above camera feed */
    a-scene[embedded], .a-canvas, canvas.a-canvas{
      position:fixed; inset:0; width:100%; height:100%;
      background:transparent; z-index:1;
    }

    /* Start overlay */
    #start{
      position:fixed; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      background:rgba(0,0,0,.9); color:#fff; z-index:3; text-align:center; padding:24px;
    }
    #start button{
      margin-top:12px; padding:12px 18px; font-size:16px; border-radius:8px; border:0;
      background:#ff6b6b; color:#fff; cursor:pointer;
    }

    /* Minimal debug/status bar */
    #status{
      position:fixed; top:8px; left:8px; right:8px;
      z-index:4; padding:6px 10px; font:12px/1.3 monospace;
      background:rgba(0,0,0,.55); color:#00e676; border:1px solid rgba(255,255,255,.3); border-radius:6px;
      pointer-events:none;
    }

    /* Fallback audio unlock */
    #soundUnlock{
      position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
      z-index:3; background:rgba(0,0,0,.7); color:#fff; border:1px solid #fff;
      padding:10px 14px; border-radius:8px; font-size:14px; display:none;
    }
  </style>
</head>
<body>

  <!-- Debug status -->
  <div id="status">⏳ ready…</div>

  <!-- Start (unlocks audio & primes video on iOS) -->
  <div id="start">
    <h2>We’re Still Marching — AR Prototype</h2>
    <p>Tap Start, allow camera, then point at the printed <b>HIRO</b> marker.</p>
    <button id="startBtn">Start</button>
  </div>

  <!-- Fallback prompt if iOS still blocks audio -->
  <button id="soundUnlock">Tap to enable sound</button>

  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="alpha:true; antialias:true"
    arjs="sourceType: webcam; debugUIEnabled:false"
    loading-screen="enabled:false">

    <a-assets timeout="1">
      <!-- BLUE-SCREEN video -->
      <video id="thembekaVideo"
             src="assets/thembeka_blue.mp4"
             loop playsinline webkit-playsinline muted
             preload="metadata"></video>

      <audio id="thembekaAudio"
             src="assets/thembeka.mp3"
             preload="auto" playsinline webkit-playsinline></audio>
    </a-assets>

    <!-- Marker -->
    <a-marker id="marker" preset="hiro" emitevents="true"
              smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">

      <!-- Video plane with CHROMA KEY (pure blue keyed out) -->
      <a-video id="thembekaPoster"
               src="#thembekaVideo"
               rotation="0 0 0"
               position="0 2 0"
               width="6.2" height="7.2"
               material="shader: chromakey; color: 0 0 1; threshold: 0.35; smoothness: 0.10"
               visible="false"></a-video>

      <a-entity light="type: ambient; intensity: 1"></a-entity>
      <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const statusEl = document.getElementById('status');
    const startUI  = document.getElementById('start');
    const startBtn = document.getElementById('startBtn');
    const unlockBtn= document.getElementById('soundUnlock');

    const marker   = document.getElementById('marker');
    const poster   = document.getElementById('thembekaPoster');
    const videoEl  = document.getElementById('thembekaVideo');
    const audioEl  = document.getElementById('thembekaAudio');

    let userPrimed = false;
    let markerVisible = false;
    let lostTimer = null;

    // ---- Your original Start button flow (unchanged) ----
    startBtn.addEventListener('click', async () => {
      try {
        await videoEl.play(); videoEl.pause(); videoEl.currentTime = 0;
        await audioEl.play(); audioEl.pause(); audioEl.currentTime = 0;
      } catch(_) {}
      userPrimed = true;
      startUI.style.display = 'none';
      status('▶️ start pressed — waiting for camera…');
    });

    // ---- Marker events (unchanged behavior) ----
    marker.addEventListener('markerFound', () => {
      markerVisible = true;
      if (lostTimer) { clearTimeout(lostTimer); lostTimer = null; }
      poster.setAttribute('visible','true');
      status('✅ marker FOUND — playing media…');
      videoEl.play().catch(()=>{});
      if (userPrimed) {
        audioEl.play().catch(()=>{ unlockBtn.style.display = 'block'; });
      } else {
        unlockBtn.style.display = 'block';
      }
    });

    marker.addEventListener('markerLost', () => {
      markerVisible = false;
      status('ℹ️ marker LOST — waiting…');
      lostTimer = setTimeout(() => {
        if (!markerVisible) {
          poster.setAttribute('visible','false');
          videoEl.pause(); videoEl.currentTime = 0;
          audioEl.pause(); audioEl.currentTime = 0;
        }
      }, 500);
    });

    // ---- Manual audio unlock ----
    unlockBtn.addEventListener('click', () => {
      audioEl.play().then(()=> { unlockBtn.style.display = 'none'; })
                    .catch(()=>{});
    });

    // ---- Camera readiness watcher (to explain "black screen") ----
    let watchTimer = null;
    function watchCamera() {
      clearInterval(watchTimer);
      watchTimer = setInterval(() => {
        const camVid = document.querySelector('video#arjs-video, video.arjs-video');
        if (!camVid) {
          status('⏳ waiting for AR.js camera element…');
          return;
        }
        // camera element exists
        if (camVid.readyState >= 2 && camVid.videoWidth > 0 && camVid.videoHeight > 0) {
          status('✅ camera video is live — point at HIRO marker');
          clearInterval(watchTimer);
        } else {
          status('⚠️ camera element present but not streaming yet (check permission / HTTPS / other app using camera)');
        }
      }, 600);
    }
    // start watching right away and again after Start
    watchCamera();

    function status(msg){ statusEl.textContent = msg; }
  </script>
</body>
</html>
