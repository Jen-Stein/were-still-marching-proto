<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>We’re Still Marching</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"/>

  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <!-- GIF shader (for the Thembeka transparent GIF) -->
  <script src="https://unpkg.com/aframe-gif-shader/dist/aframe-gif-shader.min.js"></script>

  <style>
    html, body {
      margin:0; padding:0; width:100%; height:100%;
      overflow:hidden; background:#000; font-family:Arial,sans-serif;
    }

    /* Camera feed fills screen */
    video#arjs-video, video.arjs-video{
      position:fixed !important;
      inset:0 !important;
      width:100% !important; height:100% !important;
      object-fit:cover !important;
      background:#000 !important;
      z-index:0 !important;
    }

    a-scene[embedded], .a-canvas, canvas.a-canvas{
      position:fixed !important;
      inset:0; width:100% !important; height:100% !important;
      background:transparent !important;
      z-index:1 !important;
    }

    /* Start overlay */
    #start{
      position:fixed; inset:0;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:rgba(0,0,0,.9); color:#fff; z-index:3; text-align:center; padding:24px;
    }
    #start button{
      margin-top:12px; padding:12px 18px; font-size:16px;
      border-radius:8px; border:0; background:#ff6b6b; color:#fff; cursor:pointer;
    }

    #soundUnlock{
      position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
      z-index:3; background:rgba(0,0,0,.7); color:#fff; border:1px solid #fff;
      padding:10px 14px; border-radius:8px; font-size:14px; display:none;
    }
  </style>
</head>
<body>

  <div id="start">
    <h2>We’re Still Marching — AR Prototype</h2>
    <p>Tap Start, allow camera, then point at the printed <b>KANJI</b> or <b>HIRO</b> marker.</p>
    <button id="startBtn">Start</button>
  </div>

  <button id="soundUnlock">Tap to enable sound</button>

  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="alpha:true; antialias:true"
    arjs="sourceType: webcam; debugUIEnabled:false"
    loading-screen="enabled:false">

    <a-assets timeout="1">
      <!-- INTRO stop assets (KANJI marker) -->
      <img id="introPosterImg" src="assets/intro-poster.png" crossorigin="anonymous">
      <audio id="introAudio" src="assets/intro_audio.mp3" preload="auto" playsinline webkit-playsinline></audio>

      <!-- THEMBEKA stop assets (HIRO marker) -->
      <img id="thembekaGif" src="assets/thembeka_small.gif" crossorigin="anonymous">
      <audio id="thembekaAudio" src="assets/thembeka_audio.mp3" preload="auto" playsinline webkit-playsinline></audio>
    </a-assets>

    <!-- ====== INTRO STOP: KANJI marker ====== -->
    <a-marker id="introMarker" preset="kanji" emitevents="true"
              smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">

      <!-- Intro poster: placed higher above the marker (y = 3.5) -->
      <a-image id="introPoster"
               src="#introPosterImg"
               position="0 3.5 0" rotation="0 0 0"
               width="12" height="6"
               visible="false"></a-image>

      <a-entity light="type: ambient; intensity: 1"></a-entity>
      <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>
    </a-marker>

    <!-- ====== THEMBEKA STOP: HIRO marker ====== -->
    <a-marker id="thembekaMarker" preset="hiro" emitevents="true"
              smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">

      <!-- Transparent GIF plane -->
      <a-plane id="thembekaPoster"
               position="0 2 0" rotation="0 0 0"
               width="6.2" height="7.2"
               material="shader: gif; src: #thembekaGif; transparent: true; alphaTest: 0.01"
               visible="false"></a-plane>

      <a-entity light="type: ambient; intensity: 1"></a-entity>
      <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const startUI     = document.getElementById('start');
    const startBtn    = document.getElementById('startBtn');
    const unlockBtn   = document.getElementById('soundUnlock');

    // INTRO stop elements
    const introMarker = document.getElementById('introMarker');
    const introPoster = document.getElementById('introPoster');
    const introAudio  = document.getElementById('introAudio');

    // THEMBEKA stop elements
    const thembekaMarker = document.getElementById('thembekaMarker');
    const thembekaPoster = document.getElementById('thembekaPoster');
    const thembekaAudio  = document.getElementById('thembekaAudio');

    let userPrimed = false;

    /* Sync canvas to camera (kept from your setup) */
    function syncCanvasToVideo(){
      const v = document.querySelector('video#arjs-video, video.arjs-video');
      const c = document.querySelector('canvas.a-canvas');
      if (!v || !c) return;
      const r = v.getBoundingClientRect();
      c.style.top = r.top + 'px';
      c.style.left = r.left + 'px';
      c.style.width = r.width + 'px';
      c.style.height = r.height + 'px';
    }
    const bootSync = setInterval(syncCanvasToVideo, 100);
    setTimeout(()=>clearInterval(bootSync), 4000);
    window.addEventListener('resize', syncCanvasToVideo);
    window.addEventListener('orientationchange', ()=>setTimeout(syncCanvasToVideo,300));

    /* Helper: stop all audio, then play one (prevents overlap) */
    function playOnly(audioEl){
      [introAudio, thembekaAudio].forEach(a => { try { a.pause(); a.currentTime = 0; } catch(_){} });
      if (userPrimed) {
        audioEl.play().catch(()=>{ unlockBtn.style.display = 'block'; });
      } else {
        unlockBtn.style.display = 'block';
      }
    }

    /* Start */
    startBtn.addEventListener('click', async () => {
      try {
        // prime both audios so either can play later
        await introAudio.play(); introAudio.pause(); introAudio.currentTime = 0;
        await thembekaAudio.play(); thembekaAudio.pause(); thembekaAudio.currentTime = 0;
      } catch(_) {}
      userPrimed = true;
      startUI.style.display = 'none';
      setTimeout(syncCanvasToVideo, 200);
    });

    /* ===== INTRO marker events (KANJI) ===== */
    introMarker.addEventListener('markerFound', () => {
      introPoster.setAttribute('visible', 'true');
      // hide the other poster if it was up
      thembekaPoster.setAttribute('visible', 'false');
      playOnly(introAudio);
    });
    introMarker.addEventListener('markerLost', () => {
      introPoster.setAttribute('visible', 'false');
      try { introAudio.pause(); introAudio.currentTime = 0; } catch(_){}
    });

    /* ===== THEMBEKA marker events (HIRO) ===== */
    thembekaMarker.addEventListener('markerFound', () => {
      thembekaPoster.setAttribute('visible', 'true');
      // hide the other poster if it was up
      introPoster.setAttribute('visible', 'false');
      playOnly(thembekaAudio);
    });
    thembekaMarker.addEventListener('markerLost', () => {
      thembekaPoster.setAttribute('visible', 'false');
      try { thembekaAudio.pause(); thembekaAudio.currentTime = 0; } catch(_){}
    });

    /* Manual audio unlock (iOS fallback) */
    unlockBtn.addEventListener('click', () => {
      // Try restarting the last requested audio; here we just unhide button after any play
      (introAudio.paused ? introAudio : thembekaAudio)
        .play()
        .then(()=> unlockBtn.style.display = 'none')
        .catch(()=>{});
    });
  </script>
</body>
</html>
