<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>We’re Still Marching</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"/>

  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <!-- GIF shader -->
  <script src="https://unpkg.com/aframe-gif-shader/dist/aframe-gif-shader.min.js"></script>

  <style>
    html, body {
      margin:0; padding:0; width:100%; height:100%;
      overflow:hidden; background:#000; font-family:Arial,sans-serif;
    }

    /* Camera feed fills screen */
    video#arjs-video, video.arjs-video{
      position:fixed !important;
      inset:0 !important;
      width:100% !important; height:100% !important;
      object-fit:cover !important;
      background:#000 !important;
      z-index:0 !important;
    }

    a-scene[embedded], .a-canvas, canvas.a-canvas{
      position:fixed !important;
      inset:0; width:100% !important; height:100% !important;
      background:transparent !important;
      z-index:1 !important;
    }

    /* Start overlay */
    #start{
      position:fixed; inset:0;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:rgba(0,0,0,.9); color:#fff; z-index:3; text-align:center; padding:24px;
    }
    #start button{
      margin-top:12px; padding:12px 18px; font-size:16px;
      border-radius:8px; border:0; background:#ff6b6b; color:#fff; cursor:pointer;
    }

    #soundUnlock{
      position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
      z-index:3; background:rgba(0,0,0,.7); color:#fff; border:1px solid #fff;
      padding:10px 14px; border-radius:8px; font-size:14px; display:none;
    }
  </style>
</head>
<body>

  <div id="start">
    <h2>We’re Still Marching — AR Prototype</h2>
    <p>Tap Start, allow camera, then point at the printed <b>HIRO</b> marker.</p>
    <button id="startBtn">Start</button>
  </div>

  <button id="soundUnlock">Tap to enable sound</button>

  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="alpha:true; antialias:true"
    arjs="sourceType: webcam; debugUIEnabled:false"
    loading-screen="enabled:false">

    <a-assets timeout="1">
      <img id="thembekaGif" src="assets/thembeka.gif" crossorigin="anonymous">
      <audio id="thembekaAudio"
             src="assets/thembeka.mp3"
             preload="auto" playsinline webkit-playsinline></audio>
    </a-assets>

    <a-marker id="marker" preset="hiro" emitevents="true"
              smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">

      <!-- Transparent GIF -->
      <a-plane id="thembekaPoster"
               position="0 2 0" rotation="0 0 0"
               width="6.2" height="7.2"
               material="shader: gif; src: #thembekaGif; transparent: true; alphaTest: 0.01"
               visible="false"></a-plane>

      <a-entity light="type: ambient; intensity: 1"></a-entity>
      <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const startUI   = document.getElementById('start');
    const startBtn  = document.getElementById('startBtn');
    const unlockBtn = document.getElementById('soundUnlock');

    const marker    = document.getElementById('marker');
    const poster    = document.getElementById('thembekaPoster');
    const audioEl   = document.getElementById('thembekaAudio');

    let userPrimed = false;
    let markerVisible = false;
    let lostTimer = null;

    /* Sync canvas to camera */
    function syncCanvasToVideo(){
      const v = document.querySelector('video#arjs-video, video.arjs-video');
      const c = document.querySelector('canvas.a-canvas');
      if (!v || !c) return;
      const r = v.getBoundingClientRect();
      c.style.top = r.top + 'px';
      c.style.left = r.left + 'px';
      c.style.width = r.width + 'px';
      c.style.height = r.height + 'px';
    }
    const bootSync = setInterval(syncCanvasToVideo, 100);
    setTimeout(()=>clearInterval(bootSync), 4000);
    window.addEventListener('resize', syncCanvasToVideo);
    window.addEventListener('orientationchange', ()=>setTimeout(syncCanvasToVideo,300));

    /* Start */
    startBtn.addEventListener('click', async () => {
      try { await audioEl.play(); audioEl.pause(); audioEl.currentTime = 0; } catch(_) {}
      userPrimed = true;
      startUI.style.display = 'none';
      setTimeout(syncCanvasToVideo, 200);
    });

    /* Marker events */
    marker.addEventListener('markerFound', () => {
      markerVisible = true;
      if (lostTimer) { clearTimeout(lostTimer); lostTimer = null; }
      poster.setAttribute('visible','true');
      if (userPrimed) {
        audioEl.play().catch(()=>{ unlockBtn.style.display = 'block'; });
      } else { unlockBtn.style.display = 'block'; }
    });

    marker.addEventListener('markerLost', () => {
      markerVisible = false;
      lostTimer = setTimeout(() => {
        if (!markerVisible) {
          poster.setAttribute('visible','false');
          audioEl.pause(); audioEl.currentTime = 0;
        }
      }, 500);
    });

    unlockBtn.addEventListener('click', () => {
      audioEl.play().then(()=> unlockBtn.style.display = 'none').catch(()=>{});
    });
  </script>
</body>
</html>
